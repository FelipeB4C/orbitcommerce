server:
  port: 8081
  servlet:
    context-path: /api/v1

spring:
  application:
    name: catalog-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/catalog_db
    username: orbit
    password: orbit_local_pw
    driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect

#    redis:
#      host: localhost
#      port: 6379

    flyway:
      enabled: true